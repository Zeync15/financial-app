<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/891fbe9142f7298e7fe04f5467c0b7f3">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="fa-root" style="width: {{rootW}}; height: {{rootH}}; display: flex; align-items: center; justify-content: center; padding: 24px 18px; background: var(--bg)">
  <div style="width: 384px; max-width: 88%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); padding: 40px 36px">
    <div style="text-align: center; margin-bottom: 28px">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #1ec98a; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(30,201,138,0.33); margin-bottom: 16px; color: #ffffff; font-size: 26px"><span class="ic i-dollar"></span></div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--t1); line-height: 1.35">Welcome back</h1>
      <div style="font-size: 14px; color: rgba(255,255,255,0.45)">Sign in to continue</div>
    </div>
    <a href="{{nextHref}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 46px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.34); background: #141414; color: rgba(255,255,255,0.85); font-size: 16px; font-weight: 600; text-decoration: none">
      <img src="/_blob/42ad74529f2f13bc5e4ae196cb49b71b" alt="" width="18" height="18" style="display: block">
      Continue with Google
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","options":["desktop","phone"],"default":"desktop"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.size ?? 'desktop') === 'phone';
    return {
      rootW: phone ? '402px' : '1440px',
      rootH: phone ? '874px' : '900px',
      nextHref: phone ? 'Main-phone.dc.html' : 'Main.dc.html'
    };
  }
}
</script>
</body>
</html>
