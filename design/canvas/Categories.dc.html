<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Categories</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/891fbe9142f7298e7fe04f5467c0b7f3">
<link rel="stylesheet" href="/_blob/5942119103d6ffeff8f8a6c0d63f8db0">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1ec98a}a:hover{color:#5fe0b0}
.no-sb{scrollbar-width:none;-ms-overflow-style:none}
.no-sb::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</helmet>
<div class="fa-root" style="width: {{rootW}}; height: {{rootH}}; position: relative; overflow: hidden; display: flex; flex-direction: {{rootDir}}">
  <dc-import name="Nav" size="{{size}}" active="categories" proposed="{{proposed}}" hint-size="{{navHint}}"></dc-import>
  <main style="flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: {{pad}}">
    <div class="titlebar">
      <h1 class="h1" style="font-size: {{h1Size}}">Categories</h1>
      <sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
        <button class="btn-primary-emerald" onClick="{{openNew}}"><span class="ic i-plus"></span>Add Category</button>
      </sc-if>
    </div>

    <div style="margin-bottom: 16px">
      <div class="{{segClass}}">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
          <button class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
          <div class="panel" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
            <span class="cat-grip" title="Drag to reorder"><span class="ic i-holder"></span></span>
            <span class="icc" style="width: 40px; height: 40px; font-size: 20px; color: {{c.fg}}; background: {{c.tint}}; box-shadow: {{c.ring}}"><sc-if value="{{c.hasEmoji}}" hint-placeholder-val="{{false}}"><img src="{{c.emoji}}" alt="" width="30" height="30" style="display: block; filter: {{c.emojiFx}}"></sc-if><sc-if value="{{c.noEmoji}}" hint-placeholder-val="{{true}}"><span class="{{c.icon}}"></span></sc-if></span>
            <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.name}}</span>
            <span style="display: flex; gap: 6px">
              <button class="cat-icon-btn" aria-label="Edit {{c.name}}" disabled="{{c.locked}}" title="{{c.editTip}}" onClick="{{openEdit}}"><span class="ic i-edit"></span></button>
              <button class="cat-icon-btn" aria-label="Delete {{c.name}}" disabled="{{c.locked}}" title="{{c.delTip}}"><span class="ic i-delete"></span></button>
            </span>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isPhone}}" hint-placeholder-val="{{false}}">
      <div class="panel" style="overflow: hidden">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
          <div class="{{c.rowCls}}">
            <span class="cat-grip"><span class="ic i-holder"></span></span>
            <span class="icc" style="width: 36px; height: 36px; font-size: 18px; color: {{c.fg}}; background: {{c.tint}}; box-shadow: {{c.ring}}"><sc-if value="{{c.hasEmoji}}" hint-placeholder-val="{{false}}"><img src="{{c.emoji}}" alt="" width="28" height="28" style="display: block; filter: {{c.emojiFx}}"></sc-if><sc-if value="{{c.noEmoji}}" hint-placeholder-val="{{true}}"><span class="{{c.icon}}"></span></sc-if></span>
            <span class="meta"><span class="lbl" style="display: block">{{c.name}}</span></span>
            <span style="display: flex; gap: 6px">
              <button class="cat-icon-btn" aria-label="Edit {{c.name}}" disabled="{{c.locked}}"><span class="ic i-edit"></span></button>
              <button class="cat-icon-btn" aria-label="Delete {{c.name}}" disabled="{{c.locked}}"><span class="ic i-delete"></span></button>
            </span>
          </div>
        </sc-for>
      </div>
      <div style="padding-top: 16px">
        <button class="btn-dashed" onClick="{{openNew}}"><span class="ic i-plus"></span>Add Category</button>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{showFab}}" hint-placeholder-val="{{false}}">
    <button class="fab" aria-label="Add category" style="bottom: 106px" onClick="{{openNew}}"><span class="ic i-plus"></span></button>
  </sc-if>

  <sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}">
    <sc-if value="{{showScrim}}" hint-placeholder-val="{{true}}"><div class="scrim" onClick="{{close}}"></div></sc-if>
    <div class="{{boxClass}}" role="dialog" aria-label="{{f.title}}" style="padding-bottom: {{sheetPadB}}; bottom: {{boxBottom}}; display: {{boxDisplay}}; flex-direction: column; max-height: {{boxMaxH}}; overflow: {{boxOverflow}}">
      <sc-if value="{{showGrip}}" hint-placeholder-val="{{false}}"><div class="sheet-grip"></div></sc-if>
      <sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}"><button class="fm-x" aria-label="Close" onClick="{{close}}">×</button></sc-if>
      <sc-if value="{{headSmall}}" hint-placeholder-val="{{true}}"><div class="fm-head"><span class="fm-head-ic"><span class="{{f.icon}}"></span></span>{{f.title}}</div></sc-if>
      <sc-if value="{{headFull}}" hint-placeholder-val="{{false}}"><div class="fm-full-head"><span class="fm-head-ic"><span class="{{f.icon}}"></span></span>{{f.title}}</div></sc-if>
      <div class="fm-body" style="flex: {{bodyFlex}}; min-height: {{bodyMinH}}">
        <sc-if value="{{pickerOff}}" hint-placeholder-val="{{true}}">
          <div class="field"><div class="field-lbl">Name <em class="req">*</em></div><div class="{{f.nameCls}}">{{f.name}}</div></div>
          <div class="field"><div class="field-lbl">Type <em class="req">*</em></div><div class="fld sel">{{f.type}}<span class="chev"><span class="ic i-down"></span></span></div></div>
          <div class="field"><div class="field-lbl">Color</div><div><span class="swatch-fld"><i style="background: {{f.color}}"></i>{{f.hex}}</span></div></div>
          <div class="field"><div class="field-lbl">Icon (optional)</div><div class="{{f.iconCls}}">{{f.iconKey}}</div></div>
        </sc-if>
        <sc-if value="{{pickerOn}}" hint-placeholder-val="{{false}}">
          <div class="field">
            <div class="field-lbl">Name <em class="req">*</em></div>
            <div class="{{f.nameCls}}" style="gap: 10px; justify-content: flex-start">
              <span style="flex: 0 0 auto; width: 30px; height: 30px; margin-left: -4px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px var(--line)"><img src="{{pk.preview}}" alt="" width="20" height="20" style="display: block; opacity: {{pk.previewOp}}; filter: {{pk.previewFx}}"></span>
              <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.name}}</span>
            </div>
          </div>
          <div class="field"><div class="field-lbl">Type <em class="req">*</em></div><div class="fld sel">{{f.type}}<span class="chev"><span class="ic i-down"></span></span></div></div>
          <div class="field" style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column">
            <div class="field-lbl" style="display: flex; justify-content: space-between; align-items: baseline"><span>Icon</span><span style="font-size: 11.5px; font-weight: 400; color: var(--t3)">{{pk.hint}}</span></div>
            <button class="{{pk.searchCls}}" onClick="{{pk.toggleSearch}}" style="width: 100%; gap: 10px; justify-content: flex-start; font-family: inherit; cursor: pointer; text-align: left; flex: 0 0 auto">
              <span class="ic i-search" style="color: var(--t2)"></span>
              <span style="flex: 1; min-width: 0">{{pk.searchText}}</span>
              <sc-if value="{{pk.searching}}" hint-placeholder-val="{{false}}"><span style="color: var(--t2); font-size: 18px; line-height: 1">×</span></sc-if>
            </button>
            <sc-if value="{{pk.chipsOn}}" hint-placeholder-val="{{true}}">
              <div class="no-sb" style="display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; flex: 0 0 auto">
                <sc-for list="{{pk.chips}}" as="ch" hint-placeholder-count="5">
                  <button onClick="{{ch.pick}}" style="flex: 0 0 auto; height: 30px; padding: 0 12px; border-radius: 15px; border: {{ch.border}}; background: {{ch.bg}}; color: {{ch.color}}; font-family: inherit; font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer">{{ch.label}}</button>
                </sc-for>
              </div>
            </sc-if>
            <div class="no-sb" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 2px 8px">
              <sc-for list="{{pk.sections}}" as="sec" hint-placeholder-count="3">
                <div>
                  <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--t3); padding: 12px 0 8px">{{sec.title}}</div>
                  <div role="radiogroup" aria-label="{{sec.title}}" style="display: grid; grid-template-columns: repeat({{pk.cols}}, minmax(0, 1fr)); gap: 8px 4px">
                    <sc-for list="{{sec.items}}" as="e" hint-placeholder-count="7">
                      <button role="radio" aria-checked="{{e.checked}}" aria-label="{{e.label}}" title="{{e.label}}" onClick="{{e.pick}}" style="justify-self: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; background: {{e.bg}}; box-shadow: {{e.ring}}; cursor: pointer">
                        <img src="{{e.src}}" alt="" width="28" height="28" style="display: block; filter: {{e.fx}}">
                      </button>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
              <sc-if value="{{pk.searching}}" hint-placeholder-val="{{false}}">
                <div style="font-size: 12px; color: var(--t3); padding: 14px 0 0; text-align: center">Search covers all 1,595 Fluent emoji, not just the suggested ones.</div>
              </sc-if>
            </div>
          </div>
        </sc-if>
      </div>
      <div class="fm-foot"><div class="fm-foot-right"><button class="btn-pill ghost" onClick="{{close}}">Cancel</button><button class="btn-pill primary">{{f.primary}}</button></div></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","options":["desktop","phone"],"default":"desktop"},"tab":{"editor":"enum","options":["expense","income"],"default":"expense"},"form":{"editor":"enum","options":["none","new","edit"],"default":"none"},"proposed":{"editor":"boolean","default":true},"picker":{"editor":"boolean","default":true},"search":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
